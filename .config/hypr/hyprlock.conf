# ==========================================
# HYPRLOCK CONFIG - MINECRAFT / TEAL PALETTE
# ==========================================

background {
    monitor =
    path = /home/cetos/Pictures/wallpapers/makima.png
    blur_passes = 2
    blur_size = 5
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
}

# ------------------------------------------
# ORTA ÜST: BÜYÜK SAAT & TARİH
# ------------------------------------------
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgb(139, 187, 146) # #8BBB92
    font_size = 72
    font_family = Monocraft
    position = 0, 320
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgb(9, 35, 40)
}

label {
    monitor =
    text = cmd[update:1000] date +"%A, %d %B %Y"
    color = rgb(42, 131, 95) # #2A835F
    font_size = 16
    font_family = Monocraft
    position = 0, 240
    halign = center
    valign = center
}

# ------------------------------------------
# SOL ÜST: 5 GÜNLÜK HAVA DURUMU KUTUSU
# ------------------------------------------
shape {
    monitor =
    size = 650, 550
    color = rgba(9, 35, 40, 0.92) # window#waybar background
    rounding = 10
    border_size = 2
    border_color = rgb(42, 131, 95)
    position = 40, -40
    halign = left
    valign = top
}

label {
    monitor =
    text = cmd[update:60000] ~/.config/hypr/scripts/weather.sh
    color = rgb(139, 187, 146)
    font_size = 34
    font_family = Monocraft
    line_spacing = 0
    position = 68, -50
    halign = left
    valign = top
}

# ------------------------------------------
# SAĞ ÜST: TAKVİM KUTUSU
# ------------------------------------------
shape {
    monitor =
    size = 650, 550
    color = rgba(9, 35, 40, 0.92)
    rounding = 10
    border_size = 2
    border_color = rgb(42, 131, 95)
    position = -40, -40
    halign = right
    valign = top
}

label {
    monitor =
    text = cmd[update:60000] ~/.config/hypr/scripts/calendar.sh
    color = rgb(139, 187, 146)
    font_size = 30
    font_family = Monocraft
    position = -60, -60
    halign = right
    valign = top
}

# ------------------------------------------
# MERKEZ: ŞİFRE GİRİŞ KUTUSU
# ------------------------------------------
input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.25
    dots_center = true

    outer_color = rgb(42, 131, 95) # #2A835F
    inner_color = rgb(18, 84, 79)  # #12544F
    font_color = rgb(139, 187, 146) # #8BBB92
    font_family = Monocraft

    fade_on_empty = false
    placeholder_text = <span font_family="Monocraft">Sifreyi Girin...</span>
    hide_input = false

    check_color = rgb(139, 187, 146)
    fail_color = rgb(186, 78, 78) # #BA4E4E
    fail_text = <span font_family="Monocraft">Hatali Sifre!</span>

    position = 0, -20
    halign = center
    valign = center
}
