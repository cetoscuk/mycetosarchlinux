conky.config = {
    -- Konum ve Boyut
    alignment = 'bottom_right',
    gap_x = 28,
    gap_y = 28,
    minimum_width = 300,
    maximum_width = 320,

    -- Wayland ve Katman Ayarlari
    out_to_wayland = true,
    own_window = true,
    own_window_class = 'Conky',
    own_window_type = 'normal',
    own_window_transparent = false,
    own_window_argb_visual = true,
    own_window_argb_value = 180,  -- Terminal benzeri yari saydamlik (0-255)
    own_window_colour = '09110d', -- Koyu puslu yesil kutu zemini
    double_buffer = true,
    update_interval = 1.0,

    -- Kenarlik ve Font
    draw_borders = true,
    border_width = 1,
    border_inner_margin = 12,
    use_xft = true,
    font = 'Monocraft:size=9',

    -- Renkler
    default_color = '#d0e0d2',
    color1 = '#55ff55',          -- Parlak yesil vurgu
    color2 = '#233827',          -- Arka plan cubuklari
    color3 = '#7e9e83',          -- Etiketler
};

conky.text = [[
${color1}[ SISTEM BILGISI ]${color}
${color3}Cihaz:${color}   ${nodename} ${alignr}${color3}Calisma:${color} ${uptime_short}
${color3}Kernel:${color}  ${kernel}

${color1}[ ISLEMCI (CPU) ]${color}
${color3}Kullanim:${color} ${cpu cpu0}% @ ${freq_g}GHz
${color1}${cpubar 5,300}${color}
${color3}Cekirdek:${color} ${cpu cpu1}% ${color2}|${color} ${cpu cpu2}% ${color2}|${color} ${cpu cpu3}% ${color2}|${color} ${cpu cpu4}%

${color1}[ BELLEK (RAM) ]${color}
${color3}RAM:${color}     $mem / $memmax ($memperc%)
${color1}${membar 5,300}${color}

${color1}[ DEPOLAMA (DISK) ]${color}
${color3}Root (/):${color} ${fs_used /} / ${fs_size /} (${fs_used_perc /}%)
${color1}${fs_bar 5,300 /}${color}
${color3}Disk IO:${color}  Oku: ${diskio_read} ${alignr}Yaz: ${diskio_write}

${color1}[ EN COK YORANLAR ]${color}
${color3}${top name 1}${alignr}${color}${top cpu 1}%
${color3}${top name 2}${alignr}${color}${top cpu 2}%
${color3}${top name 3}${alignr}${color}${top cpu 3}%
]];
