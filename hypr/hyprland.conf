# Monitor (oto cozunulurluk ve yenileme hizi)
monitor=eDP-1,1920x1080@60,0x0,1

# Girdi ayarlari (turkce q ve touchpad)
input {
	kb_layout = tr
	follow_mouse = 1

	touchpad {
		natural_scroll = true
		tap-to-click = true
	}
}

# Genel gorunum
general {
	gaps_in = 5
	gaps_out = 10
	border_size = 2
	col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
	col.inactive_border = rgba(595959aa)
	layout = dwindle
}

# Temel kisayollar (SUPER = Windows key)
$mainMod = SUPER

bind = $mainMod, Q, exec, kitty
bind = $mainMod, C, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, thunar
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, rofi -show drun

# Calisma alani gecisleri (SUPER + 1...9)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4

# Penceleri Calisma Alanina tasima (SUPER + Shift + 1...9)
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4

# Fare ile pencere tasima ve boyutlandirma
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Ses Paneli (Pavucontrol Popup Modu)
windowrulev2 = float, class:(org.pulseaudio.pavucontrol)
windowrulev2 = size 420 480, class:(org.pulseaudio.pavucontrol)
windowrulev2 = move 95 260, class:(org.pulseaudio.pavucontrol)
windowrulev2 = pin, class:(org.pulseaudio.pavucontrol)

# Ses Paneli Sabitleme (AudioPopup Fallback)
windowrule = float, ^(AudioPopup)$
windowrule = float, title:^(AudioPopup)$
windowrule = size 250 240, title:^(AudioPopup)$
windowrule = move 95 300, title:^(AudioPopup)$
windowrule = pin, title:^(AudioPopup)$
windowrule = noborder, title:^(AudioPopup)$

# Minecraft Ses Menusu (mc-audio-popup / Slider-popup.py)
windowrulev2 = float, title:^(mc-audio-popup)$
windowrulev2 = size 230 160, title:^(mc-audio-popup)$
windowrulev2 = move 95 510, title:^(mc-audio-popup)$
windowrulev2 = pin, title:^(mc-audio-popup)$
windowrulev2 = noborder, title:^(mc-audio-popup)$
windowrulev2 = float, class:^(Slider-popup.py)$
windowrulev2 = move 95 510, class:^(Slider-popup.py)$
windowrulev2 = float, class:^(mc-audio-popup)$
windowrulev2 = move 95 510, class:^(mc-audio-popup)$
windowrulev2 = pin, class:^(mc-audio-popup)$
windowrulev2 = noborder, class:^(mc-audio-popup)$

# Minecraft Wi-Fi Menusu Konum Sabitleme
windowrulev2 = float, class:^(mc-wifi-popup)$
windowrulev2 = move 95 60, class:^(mc-wifi-popup)$
windowrulev2 = pin, class:^(mc-wifi-popup)$
windowrulev2 = noborder, class:^(mc-wifi-popup)$

# Minecraft Bluetooth Menusu Konum Sabitleme
windowrulev2 = float, class:^(mc-bluetooth-popup)$
windowrulev2 = move 95 430, class:^(mc-bluetooth-popup)$
windowrulev2 = pin, class:^(mc-bluetooth-popup)$
windowrulev2 = noborder, class:^(mc-bluetooth-popup)$

# Baslangic Komutlari
exec-once = bt-agent -c NoInputNoOutput
exec-once = sleep 0.5 && hyprlock
layerrule = noanim, waybar

bind = Mod4, A, exec, /home/cetos/.config/hypr/scripts/screenshot.sh

# Steam ana penceresini tiling tut, açılır pop-up'ları float yap
windowrulev2 = stayfocused, title:^()$,class:^(steam)$
windowrulev2 = minsize 1 1, title:^()$,class:^(steam)$
windowrulev2 = float, class:^(steam)$, title:^(Special Offers)$
windowrulev2 = float, class:^(steam)$, title:^(Steam Ayarları)$
windowrulev2 = float, class:^(steam)$, title:^(Friends List)$

# Steam haberler / bildirimler penceresini float yap, boyutlandır ve ortala
windowrulev2 = float, class:^(steam)$, title:^(.*(News|Haberler|Special Offers|Updates).*)$
windowrulev2 = size 900 650, class:^(steam)$, title:^(.*(News|Haberler|Special Offers|Updates).*)$
windowrulev2 = center, class:^(steam)$, title:^(.*(News|Haberler|Special Offers|Updates).*)$

# Nvidia & XWayland Ayarları
env = LIBVA_DRIVER_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct

# XWayland ölçekleme kilidi
xwayland {
    force_zero_scaling = true
}

env = STEAM_FORCE_DESKTOPUI_SCALING,1
env = GDK_SCALE,1
exec-once = hyprpaper
windowrulev2 = float, class:^(conky)$
windowrulev2 = pin, class:^(conky)$
windowrulev2 = nofocus, class:^(conky)$

# Conky Masaustu Katman Kurallari
windowrulev2 = float, class:^(conky)$
windowrulev2 = pin, class:^(conky)$
windowrulev2 = nofocus, class:^(conky)$
windowrulev2 = noborder, class:^(conky)$
windowrulev2 = noshadow, class:^(conky)$
windowrulev2 = nodim, class:^(conky)$

# Conky Pencere Kurallari (Sag alt, yuzdurulen ve arkada kalan)
windowrulev2 = float, class:^(Conky|conky)$
windowrulev2 = pin, class:^(Conky|conky)$
windowrulev2 = nofocus, class:^(Conky|conky)$
windowrulev2 = noinitialfocus, class:^(Conky|conky)$
windowrulev2 = move 100%-340 100%-480, class:^(Conky|conky)$

# Conky Yuzduren ve Sabit Katman Kurali
windowrulev2 = float, class:^(conky|Conky)$
windowrulev2 = pin, class:^(conky|Conky)$
windowrulev2 = nofocus, class:^(conky|Conky)$
windowrulev2 = noinitialfocus, class:^(conky|Conky)$
windowrulev2 = move 100%-350 100%-520, class:^(conky|Conky)$
exec-once = conky -c ~/.config/conky/conky.conf
